name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # यह कैशे सिस्टम है: इससे बार-बार 2GB फाइलें डाउनलोड नहीं होंगी, टाइम और डेटा बचेगा
      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-global-${{ hashFiles('Compressedfile2.zip') }}
          restore-keys: |
            buildozer-global-

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update || true
          # यहाँ build-essential जोड़ा गया है ताकि C/C++ कोड बिना क्रैश हुए चले
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          # यहाँ Cython का स्टेबल वर्ज़न फिक्स कर दिया गया है
          pip install buildozer "cython<3.0.0" virtualenv

      - name: Unzip Game Files and Verify
        run: |
          unzip -o Compressedfile2.zip -d .
          echo "ZIP खुलने के बाद ये फाइलें मिली हैं:"
          ls -la

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-APK
          path: bin/*.apk
